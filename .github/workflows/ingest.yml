name: 云端论文库自动扩充与发布

on:
  schedule:
    - cron: '30 21 * * *' # 北京时间每天 05:30(先于本地 6 点日报任务)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: 云端抓取新论文(按主题轮换)
        run: python site/scripts/cloud_ingest.py

      - name: 合入论文库
        run: python site/scripts/build_db.py

      - name: 构建网站
        run: |
          npm install --no-fund --no-audit --prefix site
          npm run build --prefix site

      - name: 提交并推送
        run: |
          git config user.name "QuantOpt Bot"
          git config user.email "heliming25@163.com"
          git add -A
          git commit -m "云端扩库 $(date -u +%F) [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
